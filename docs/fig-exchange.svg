<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" role="img" aria-label="one exchange — predict, one step, then a scored check. The tutor asks whether d of d vanishes for every 1-form; the learner answers &quot;only for exact ones&quot; at a stated probability of 0.70, committed inside the same question. One reasoning step follows, then the item is scored wrong with a Brier penalty of 0.49."><title>predict, one step, then a scored check</title><rect width="640" height="450" fill="#f3ede8"></rect><rect x="12.5" y="12.5" width="615" height="425" fill="none" stroke="#c3b6b3" stroke-width="1.06"></rect><text x="30" y="44" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8d8087" letter-spacing="2.4" text-anchor="start" font-style="normal" font-weight="400">FIG. 3 · ONE EXCHANGE</text><text x="30" y="72" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="20" fill="#191315" letter-spacing="0" text-anchor="start" font-style="italic" font-weight="400">predict, one step, then a scored check</text><text x="30" y="92" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#5d5158" letter-spacing="0.4" text-anchor="start" font-style="normal" font-weight="400">node 4 of 12 · exterior derivative · differential forms</text><path d="M30,116 H610" stroke="#c3b6b3" stroke-width="1.06"></path><circle cx="44" cy="146" r="9" fill="none" stroke="#5d5158" stroke-width="1.2"></circle><text x="44" y="150" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#5d5158" letter-spacing="0" text-anchor="middle" font-style="normal" font-weight="400">1</text><text x="70" y="150" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8d8087" letter-spacing="2.4" text-anchor="start" font-style="normal" font-weight="400">PREDICT</text><text x="70" y="178" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="14" fill="#191315" letter-spacing="0" text-anchor="start" font-style="normal" font-weight="400">“Does d∘d = 0 hold for every 1-form, or only for exact ones?”</text><circle cx="44" cy="268" r="9" fill="none" stroke="#5d5158" stroke-width="1.2"></circle><text x="44" y="272" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#5d5158" letter-spacing="0" text-anchor="middle" font-style="normal" font-weight="400">2</text><text x="70" y="272" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8d8087" letter-spacing="2.4" text-anchor="start" font-style="normal" font-weight="400">ONE STEP</text><text x="70" y="296" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="14" fill="#191315" letter-spacing="0" text-anchor="start" font-style="normal" font-weight="400">d of a 1-form is a 2-form built from mixed partials. They commute,</text><text x="70" y="316" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="14" fill="#191315" letter-spacing="0" text-anchor="start" font-style="normal" font-weight="400">so the terms cancel — for every smooth form, exact or not.</text><circle cx="44" cy="364" r="9" fill="none" stroke="#5d5158" stroke-width="1.2"></circle><text x="44" y="368" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#5d5158" letter-spacing="0" text-anchor="middle" font-style="normal" font-weight="400">3</text><text x="70" y="368" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8d8087" letter-spacing="2.4" text-anchor="start" font-style="normal" font-weight="400">SCORED</text><text x="70" y="202" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8d8087" letter-spacing="0.4" text-anchor="start" font-style="normal" font-weight="400">answer</text><text x="140" y="202" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#191315" letter-spacing="0.4" text-anchor="start" font-style="normal" font-weight="400">only for exact ones</text><text x="380" y="202" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#c31f6d" letter-spacing="0.4" text-anchor="start" font-style="normal" font-weight="400">stated P = 0.70</text><text x="70" y="222" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8d8087" letter-spacing="0.4" text-anchor="start" font-style="normal" font-weight="400">committed inside the same question — not revisable after feedback</text><path d="M30,238 H610" stroke="#e3d9d5" stroke-width="1.06"></path><path d="M30,336 H610" stroke="#e3d9d5" stroke-width="1.06"></path><text x="70" y="392" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c31f6d" letter-spacing="0.6" text-anchor="start" font-style="normal" font-weight="400">wrong</text><text x="122" y="392" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#191315" letter-spacing="0.6" text-anchor="start" font-style="normal" font-weight="400">· brier (0.70 − 0)² = 0.49</text><text x="70" y="412" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8d8087" letter-spacing="0.4" text-anchor="start" font-style="normal" font-weight="400">a confident miss re-enters the arc; the tutor does not just move on</text></svg>
